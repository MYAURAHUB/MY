<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - Premium Experience</title>
    <style>
        /* ==========================================================================
        1. DESIGN SYSTEM & VARIABLES
           ========================================================================== */
        :root {
            --bg-base: #030303;
            --bg-surface: rgba(18, 18, 18, 0.6);
            --bg-surface-hover: rgba(30, 30, 30, 0.8);
            --bg-modal: rgba(10, 10, 10, 0.85);
            --border-glow: rgba(255, 255, 255, 0.08);
            --border-glow-hover: rgba(255, 255, 255, 0.2);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #ffffff;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --blur-radius: 30px;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Oculta el cursor del sistema únicamente en ordenadores */
        @media (min-width: 1025px) {
            * {
                cursor: none !important;
            }
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body.modal-open {
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        /* ==========================================================================
        2. CINEMATIC BACKGROUNDS & MOUSE
           ========================================================================== */
        .aurora-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden; pointer-events: none; opacity: 0.6;
        }
        .aurora-sphere {
            position: absolute; bottom: -20%; right: -10%; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(102,51,255,0.15) 0%, rgba(0,0,0,0) 70%); filter: blur(80px);
            animation: floatAurora 20s infinite alternate var(--transition-smooth);
        }
        .aurora-sphere-2 {
            position: absolute; top: -20%; left: -10%; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255,51,102,0.1) 0%, rgba(0,0,0,0) 70%); filter: blur(100px);
            animation: floatAurora 15s infinite alternate-reverse var(--transition-smooth);
        }
        @keyframes floatAurora { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(80px, 50px) scale(1.2); } }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        .mouse-follower { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s, background-color 0.2s; }
        .mouse-follower-aura { width: 40px; height: 40px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: transform 0.08s ease-out, width 0.3s, height 0.3s; }
        .pointer-hover .mouse-follower { width: 24px; height: 24px; background: rgba(255,255,255,0.15); backdrop-filter: blur(4px); }
        .pointer-hover .mouse-follower-aura { width: 60px; height: 60px; border-color: rgba(255, 255, 255, 0.5); }

        /* ==========================================================================
        3. GLASS HEADER
           ========================================================================== */
        .glass-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px; background: var(--bg-surface); backdrop-filter: blur(var(--blur-radius)); -webkit-backdrop-filter: blur(var(--blur-radius)); border-bottom: 1px solid var(--border-glow); z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
        }
        .header-left { display: flex; align-items: center; gap: 32px; }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(to right, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .nav-menu { display: flex; gap: 24px; list-style: none; }
        .nav-link { color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; position: relative; transition: color 0.3s; }
        .nav-link:hover, .nav-link.active { color: var(--text-primary); }
        .search-container { flex: 0 1 400px; position: relative; }
        .search-input { width: 100%; padding: 12px 20px 12px 48px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glow); border-radius: 30px; color: var(--text-primary); font-family: var(--font-sans); outline: none; transition: all 0.3s var(--transition-smooth); }
        .search-input:focus { border-color: rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.08); }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); width: 16px; height: 16px; }
        .header-right { display: flex; align-items: center; gap: 24px; }
        .icon-btn { background: none; border: none; color: var(--text-primary); position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.03); border: 1px solid var(--border-glow); }
        .notification-badge { position: absolute; top: 10px; right: 10px; width: 6px; height: 6px; background: #ff3366; border-radius: 50%; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-glow); }

        /* ==========================================================================
        4. MASONRY GRID & CARDS (OPTIMIZADO PARA 2 COLUMNAS EN MÓVIL)
           ========================================================================== */
        main { padding-top: 120px; padding-bottom: 60px; width: 100%; max-width: 1800px; margin: 0 auto; position: relative; z-index: 10; }
        
        .masonry-grid { columns: 5 300px; column-gap: 24px; padding: 0 40px; width: 100%; }
        
        @media (max-width: 1200px) { .masonry-grid { columns: 3; } }
        @media (max-width: 768px) { 
            .masonry-grid { columns: 2 !important; padding: 0 12px; column-gap: 12px; } 
            .glass-header { padding: 0 20px; } 
            .search-container { display: none; } 
        }

        .card-wrapper { break-inside: avoid; margin-bottom: 24px; opacity: 0; transform: translateY(40px) scale(0.95); animation: revealCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; perspective: 1000px; }
        @media (max-width: 768px) { .card-wrapper { margin-bottom: 12px; } }
        @keyframes revealCard { to { opacity: 1; transform: translateY(0) scale(1); } }

        .premium-card { position: relative; background: var(--bg-surface); border: 1px solid var(--border-glow); border-radius: 24px; overflow: hidden; transform-style: preserve-3d; transition: border-color 0.4s var(--transition-smooth), box-shadow 0.4s var(--transition-smooth); }
        .premium-card:hover { border-color: var(--border-glow-hover); box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .card-media-box { position: relative; width: 100%; overflow: hidden; background: #111; }
        .card-img { width: 100%; height: auto; display: block; object-fit: cover; transition: transform 0.7s cubic-bezier(0.15, 1, 0.3, 1); will-change: transform; }
        .premium-card:hover .card-img { transform: scale(1.06) translateZ(10px); }

        .card-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(3,3,3,0.95) 0%, rgba(3,3,3,0.4) 40%, rgba(0,0,0,0) 100%); opacity: 0; transition: opacity 0.4s var(--transition-smooth); display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; z-index: 2; }
        @media (max-width: 768px) { .card-overlay { opacity: 1; padding: 12px; } }
        .premium-card:hover .card-overlay { opacity: 1; }
        .card-content { transform: translateY(15px); transition: transform 0.4s var(--transition-smooth); }
        @media (max-width: 768px) { .card-content { transform: translateY(0); } }
        .premium-card:hover .card-content { transform: translateY(0); }
        .card-category { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 700; display: block; }
        @media (max-width: 768px) { .card-category { font-size: 8px; margin-bottom: 2px; } }
        .card-title { font-size: 18px; font-weight: 600; color: var(--text-primary); line-height: 1.3; margin-bottom: 12px; }
        @media (max-width: 768px) { .card-title { font-size: 13px; margin-bottom: 6px; } }
        .card-footer { display: flex; align-items: center; justify-content: space-between; opacity: 0; transition: opacity 0.3s ease; }
        @media (max-width: 768px) { .card-footer { opacity: 1; } }
        .premium-card:hover .card-footer { opacity: 1; }
        .author-info { display: flex; align-items: center; gap: 10px; }
        .author-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
        .author-name { font-size: 12px; color: var(--text-primary); font-weight: 500; }
        @media (max-width: 768px) { .author-name { font-size: 10px; } .author-avatar { width: 18px; height: 18px; } }
        .action-btn { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 16px; border-radius: 20px; color: white; font-size: 12px; font-weight: 600; transition: all 0.2s; }
        @media (max-width: 768px) { .action-btn { display: none; } }
        .action-btn:hover { background: #fff; color: #000; transform: scale(1.05); }

        .infinite-loader-trigger { width: 100%; height: 60px; display: flex; justify-content: center; align-items: center; margin-top: 40px; }
        .spinner { width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--text-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ==========================================================================
        5. NEXT-GEN DETAILED INTERFACE
           ========================================================================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-modal);
            backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), backdrop-filter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1; pointer-events: auto;
            backdrop-filter: blur(var(--blur-radius)); -webkit-backdrop-filter: blur(var(--blur-radius));
        }

        .modal-window {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid var(--border-glow);
            width: 100%; max-width: 1100px; height: 85vh;
            border-radius: 32px; overflow: hidden;
            display: grid; grid-template-columns: 1.2fr 1fr;
            transform: scale(0.9) translateY(30px);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }

        .modal-overlay.active .modal-window {
            transform: scale(1) translateY(0); opacity: 1;
        }

        .modal-media-side {
            position: relative; width: 100%; height: 100%; background: #0a0a0a;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .modal-main-img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.8s var(--transition-smooth);
        }

        .modal-media-side:hover .modal-main-img {
            transform: scale(1.03);
        }

        .modal-info-side {
            padding: 48px; display: flex; flex-direction: column; justify-content: space-between;
            background: linear-gradient(135deg, rgba(15,15,15,0.7) 0%, rgba(25,25,25,0.7) 100%);
            backdrop-filter: blur(10px); border-left: 1px solid var(--border-glow);
            overflow-y: auto;
        }

        .modal-header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        
        .close-modal-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-glow);
            color: var(--text-primary); width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
        }
        .close-modal-btn:hover { background: #fff; color: #000; transform: rotate(90deg); }

        .modal-body-content { flex-grow: 1; }
        .modal-tag { font-size: 11px; font-weight: 700; color: var(--text-secondary); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; display: block;}
        .modal-title { font-size: 32px; font-weight: 700; line-height: 1.2; letter-spacing: -0.5px; margin-bottom: 20px; }
        .modal-description { color: var(--text-secondary); font-size: 15px; line-height: 1.6; margin-bottom: 40px; }

        .modal-author-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-glow); border-radius: 20px;
        }

        .cta-premium-btn {
            background: #fff; color: #000; border: none; padding: 14px 28px; border-radius: 30px;
            font-weight: 600; font-size: 14px; transition: all 0.3s var(--transition-smooth);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }
        .cta-premium-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(255,255,255,0.2); }

        @media (max-width: 900px) {
            .modal-window { grid-template-columns: 1fr; height: 90vh; }
            .modal-media-side { height: 40vh; }
            .modal-info-side { padding: 24px; height: 50vh; }
            .modal-title { font-size: 24px; }
        }
    </style>
