<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATINAS</title>
    <meta name="description" content="Premium visual network inspired by the future. Engineered for elite creators.">
    
    <style>
        /* ==========================================================================
        1. DESIGN SYSTEM & VARIABLES (Stripe/Linear Inspired)
           ========================================================================== */
        :root {
            --bg-base: #030303;
            --bg-surface: rgba(18, 18, 18, 0.6);
            --bg-surface-hover: rgba(30, 30, 30, 0.8);
            --border-glow: rgba(255, 255, 255, 0.08);
            --border-glow-hover: rgba(255, 255, 255, 0.2);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #ffffff;
            --accent-gradient: linear-gradient(135deg, #ff3366, #6633ff);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --blur-radius: 20px;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /*cursor: none !important; /* For custom mouse follower */
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* ==========================================================================
        2. CINEMATIC BACKGROUNDS (Aurora & Particles)
           ========================================================================== */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
            opacity: 0.6;
        }

        .aurora-sphere {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(102,51,255,0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(80px);
            animation: floatAurora 20s infinite alternate var(--transition-smooth);
        }

        .aurora-sphere-2 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,51,102,0.1) 0%, rgba(0,0,0,0) 70%);
            filter: blur(100px);
            animation: floatAurora 15s infinite alternate-reverse var(--transition-smooth);
        }

        @keyframes floatAurora {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.2); }
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* ==========================================================================
        3. CUSTOM MOUSE FOLLOWER
           ========================================================================== */
        .mouse-follower {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        .mouse-follower-aura {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.08s ease-out, width 0.3s, height 0.3s;
        }

        /* Hover State Class triggered by JS */
        .pointer-hover .mouse-follower {
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
        }
        .pointer-hover .mouse-follower-aura {
            width: 60px;
            height: 60px;
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* ==========================================================================
        4. ULTRA-PREMIUM HEADER (Glassmorphism & Expandable Search)
           ========================================================================== */
        .glass-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: var(--bg-surface);
            backdrop-filter: blur(var(--blur-radius));
            -webkit-backdrop-filter: blur(var(--blur-radius));
            border-bottom: 1px solid var(--border-glow);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            transition: background 0.3s, border 0.3s;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* ==========================================================================
        5. MAIN INTERFACE: REVEAL HERO & PERFECT MASONRY GRID
           ========================================================================== */
        main {
            padding-top: 120px;
            padding-bottom: 60px;
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* Masonry Layout */
        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            padding: 0 40px;
            width: 100%;
        }

        /* CONTENEDOR INTEGRADO DEL BANNER NATIVO */
        .native-banner-wrapper {
            grid-column: 1 / -1; /* Forzar a que ocupe todo el ancho del grid sin romper columnas */
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            margin: 12px 0;
            backdrop-filter: blur(var(--blur-radius));
            -webkit-backdrop-filter: blur(var(--blur-radius));
        }

        /* Responsive Columns adjustment */
        @media (max-width: 1200px) {
            .masonry-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .masonry-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
                padding: 0 16px;
            }

            .glass-header {
                padding: 0 16px;
            }
        }

        /* ==========================================================================
        6. ARTIFACT CARDS (3D Tilt, Cinematic Zoom, Dynamic Overlays)
           ========================================================================== */
        .card-wrapper {
            margin: 0;
            width: 100%;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            animation: revealCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            perspective: 1000px;
        }

        @keyframes revealCard {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .premium-card {
            position: relative;
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            overflow: hidden;
            transform-style: preserve-3d;
            height: 100%;
            transition: border-color 0.4s var(--transition-smooth), box-shadow 0.4s var(--transition-smooth);
        }

        .premium-card:hover {
            border-color: var(--border-glow-hover);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(255,255,255,0.02);
        }

        .card-media-box {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #111;
            aspect-ratio: 1 / 1.3;
        }

        /* Progressive Image Zoom & Scale */
        .card-img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.15, 1, 0.3, 1);
            will-change: transform;
            pointer-events: auto;
            cursor: pointer;
        }

        .premium-card:hover .card-img {
            transform: scale(1.06) translateZ(10px);
        }

        /* Cinematic Luxury Overlay */
        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(3,3,3,0.95) 0%, rgba(3,3,3,0.4) 40%, rgba(0,0,0,0) 100%);
            opacity: 0;
            transition: opacity 0.4s var(--transition-smooth);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            z-index: 2;
        }

        .premium-card:hover .card-overlay {
            opacity: 1;
        }

        .card-content {
            transform: translateY(15px);
            transition: transform 0.4s var(--transition-smooth);
        }

        .premium-card:hover .card-content {
            transform: translateY(0);
        }

        /* ==========================================================================
        7. SKELETON LOADING EFFECTS
           ========================================================================== */
        .infinite-loader-trigger {
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--text-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (hover: none), (pointer: coarse) {
            * {
                cursor: auto !important;
            }

            .mouse-follower,
            .mouse-follower-aura {
                display: none !important;
            }
        }

        /* ==========================================
           FULLSCREEN IMAGE VIEWER
        ========================================== */
        .image-modal {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            transition: all .35s ease;
        }

        .image-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .image-modal img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            transform: scale(.9);
            transition: transform .35s ease;
        }

        .image-modal.active img {
            transform: scale(1);
        }

        /* ==========================================
           NUEVOS ESTILOS PARA EL BANNER 300x250 
        ========================================== */
        .banner-card-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
        }

        @media (max-width: 768px) {
            .banner-card-wrapper {
                grid-column: span 2; /* Forza a ocupar el ancho completo en mobile */
            }
        }

        .premium-banner-box {
            width: 100%;
            max-width: 340px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 20px 0 30px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            backdrop-filter: blur(var(--blur-radius));
            -webkit-backdrop-filter: blur(var(--blur-radius));
        }
    </style>
</head>
<body>

    <div class="mouse-follower" id="js-follower"></div>
    <div class="mouse-follower-aura" id="js-follower-aura"></div>

    <div class="aurora-bg">
        <div class="aurora-sphere"></div>
        <div class="aurora-sphere-2"></div>
    </div>
    <canvas id="particle-canvas"></canvas>

    <header class="glass-header">
        <div class="header-left">
            <div class="logo">LATINAS</div>
        </div>
    </header>

    <main>
        <div class="masonry-grid" id="js-grid"></div>

        <div class="infinite-loader-trigger" id="js-infinite-trigger">
            <div class="spinner"></div>
        </div>
    </main>

    <div class="image-modal" id="js-modal" onclick="this.classList.remove('active')">
        <img id="js-modal-img" src="" alt="Preview">
    </div>

    <script>
        // 1. CONFIGURACIÓN DE IMÁGENES LOCALES
        const ASSET_PIPELINE = [
            { img: "1.png" }, { img: "2.JPG" }, { img: "3.JPG" },
            { img: "4.png" }, { img: "5.jpg" }, { img: "6.jpg" },
            { img: "7.png" }, { img: "8.jpg" }, { img: "9.JPG" },
            { img: "10.png" }, { img: "11.JPG" }, { img: "12.JPG" },
            { img: "13.png" }, { img: "14.jpg" }, { img: "15.JPG" },
            { img: "16.JPG" }, { img: "17.JPG" }, { img: "18.JPG" },
            { img: "19.JPG" }, { img: "20.JPG" }, { img: "21.JPG" },
            { img: "22.jpeg" }, { img: "23.JPG" }, { img: "24.jpeg" },
            { img: "25.JPG" },
        ];

        // Global variables for banner control
        let bannerInserted = false;          // Controla el Native Banner (Posición 6)
        let rectangleBannerInserted = false; // Controla el nuevo Banner 300x250 (Posición 13)
        let globalCardCount = 0;

        document.addEventListener("DOMContentLoaded", () => {
            const isMobile = window.matchMedia("(hover: none)").matches || window.matchMedia("(pointer: coarse)").matches;

            if (!isMobile) {
                initMouseFollower();
                initMagneticButtons();
            } else {
                document.getElementById("js-follower")?.remove();
                document.getElementById("js-follower-aura")?.remove();
            }

            initParticleBackground();

            // Renderizamos un lote inicial de 15 tarjetas.
            generateCardBatch(15);
            initInfiniteScroll();
        });

        /* --------------------------------------------------------------------------
        A. INTERACTIVE MOUSE PATTERNS & HOVER EFFECTS
           -------------------------------------------------------------------------- */
        function initMouseFollower() {
            const follower = document.getElementById("js-follower");
            const aura = document.getElementById("js-follower-aura");
            
            let posX = 0, posY = 0;
            let mouseX = 0, mouseY = 0;

            window.addEventListener("mousemove", (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                
                follower.style.left = `${mouseX}px`;
                follower.style.top = `${mouseY}px`;
            });

            function animateAura() {
                posX += (mouseX - posX) * 0.15;
                posY += (mouseY - posY) * 0.15;
                
                aura.style.left = `${posX}px`;
                aura.style.top = `${posY}px`;
                
                requestAnimationFrame(animateAura);
            }
            animateAura();

            const bindHovers = () => {
                const interactives = document.querySelectorAll("a, button, .premium-card, input");
                interactives.forEach(el => {
                    el.addEventListener("mouseenter", () => document.body.classList.add("pointer-hover"));
                    el.addEventListener("mouseleave", () => document.body.classList.remove("pointer-hover"));
                });
            };
            
            const observer = new MutationObserver(bindHovers);
            observer.observe(document.getElementById("js-grid"), { childList: true });
            bindHovers();
        }

        /* --------------------------------------------------------------------------
        B. AMBIENT PARTICLES MATRIX
           -------------------------------------------------------------------------- */
        function initParticleBackground() {
            const canvas = document.getElementById("particle-canvas");
            const ctx = canvas.getContext("2d");
            let particles = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener("resize", resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 1.5 + 0.5;
                    this.speedX = Math.random() * 0.2 - 0.1;
                    this.speedY = Math.random() * -0.3 - 0.1;
                    this.alpha = Math.random() * 0.5 + 0.1;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.y < 0) {
                        this.y = canvas.height;
                        this.x = Math.random() * canvas.width;
                    }
                }
                draw() {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(loop);
            }
            loop();
        }

        /* --------------------------------------------------------------------------
        C. MAGNETIC INTERACTION ENGINE
           -------------------------------------------------------------------------- */
        function initMagneticButtons() {
            const targets = document.querySelectorAll('.magnetic');
            targets.forEach(btn => {
                btn.addEventListener('mousemove', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width/2;
                    const y = e.clientY - rect.top - rect.height/2;
                    this.style.transform = `translate(${x * 0.35}px, ${y * 0.35}px)`;
                });
                btn.addEventListener('mouseleave', function() {
                    this.style.transform = 'translate(0px, 0px)';
                });
            });
        }

        /* --------------------------------------------------------------------------
        D. CARDS GENERATOR PIPELINE
           -------------------------------------------------------------------------- */
        function generateCardBatch(count) {
            const grid = document.getElementById("js-grid");
            
            for (let i = 0; i < count; i++) {
                globalCardCount++;

                // Tarjeta de contenido normal
                const schema = ASSET_PIPELINE[Math.floor(Math.random() * ASSET_PIPELINE.length)];
                const cardWrapper = document.createElement("div");
                cardWrapper.className = "card-wrapper";
                cardWrapper.style.animationDelay = `${(i % 6) * 0.08}s`;

                cardWrapper.innerHTML = `
                    <div class="premium-card">
                        <div class="card-media-box">
                            <img src="${schema.img}" class="card-img" loading="lazy">
                        </div>
                        <div class="card-overlay">
                            <div class="card-content"></div>
                        </div>
                    </div>
                `;

                grid.appendChild(cardWrapper);

                const card = cardWrapper.querySelector(".premium-card");
                card.addEventListener("click", () => {
                    openImageModal(schema.img);  
                });
                bindTiltEffect(card);

                // CONTROL INSERCIÓN 1: NATIVE BANNER (Posición 6)
                if (globalCardCount === 6 && !bannerInserted) {
                    bannerInserted = true;
                    const bannerWrapper = document.createElement("div");
                    bannerWrapper.className = "native-banner-wrapper";
                    bannerWrapper.innerHTML = `<div id="container-08b3b5ac0a05c03e36bd03b41791e4af" style="width:100%; display:flex; justify-content:center;"></div>`;
                    grid.appendChild(bannerWrapper);

                    const script = document.createElement("script");
                    script.async = true;
                    script.setAttribute("data-cfasync", "false");
                    script.src = "https://pl29631893.effectivecpmnetwork.com/08b3b5ac0a05c03e36bd03b41791e4af/invoke.js";
                    bannerWrapper.appendChild(script);
                }

                // CONTROL INSERCIÓN 2: NUEVO BANNER 300x250 (Posición 13)
                if (globalCardCount === 12 && !rectangleBannerInserted) {
                    rectangleBannerInserted = true;
                    const bannerWrapper300 = document.createElement("div");
                    bannerWrapper300.className = "banner-card-wrapper";
                    
                    // Creamos el contenedor interno del placeholder
                    const placeholderBox = document.createElement("div");
                    placeholderBox.className = "premium-banner-box";
                    
                    const container300 = document.createElement("div");
                    container300.id = "container-300x250-placeholder";
                    container300.style.width = "300px";
                    container300.style.height = "250px";
                    container300.style.background = "#111";
                    
                    placeholderBox.appendChild(container300);
                    bannerWrapper300.appendChild(placeholderBox);
                    grid.appendChild(bannerWrapper300);

                    // 1. Script de configuracion (atOptions)
                    const scriptConfig = document.createElement("script");
                    scriptConfig.type = "text/javascript";
                    scriptConfig.text = `
                        atOptions = {
                            'key' : 'efe027ea155f16fe50be8f1783208e0b',
                            'format' : 'iframe',
                            'height' : 250,
                            'width' : 300,
                            'params' : {}
                        };
                    `;
                    container300.appendChild(scriptConfig);

                    // 2. Script que invoca el anuncio externo
                    const scriptInvoke = document.createElement("script");
                    scriptInvoke.type = "text/javascript";
                    scriptInvoke.src = "https://www.highperformanceformat.com/efe027ea155f16fe50be8f1783208e0b/invoke.js";
                    container300.appendChild(scriptInvoke);
                }
            }
        }

        function bindTiltEffect(card) {
            card.addEventListener("mousemove", (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const xc = rect.width / 2;
                const yc = rect.height / 2;
                const angleX = (yc - y) / 15;
                const angleY = (x - xc) / 15;
                card.style.transform = `rotateX(${angleX}deg) rotateY(${angleY}deg)`;
            });

            card.addEventListener("mouseleave", () => {
                card.style.transform = "rotateX(0deg) rotateY(0deg)";
            });
        }

        function openImageModal(src) {
            const modal = document.getElementById("js-modal");
            const modalImg = document.getElementById("js-modal-img");
            modalImg.src = src;
            modal.classList.add("active");
        }

        /* --------------------------------------------------------------------------
        E. INFINITE SCROLL ENGINE (Intersection Observer)
           -------------------------------------------------------------------------- */
        function initInfiniteScroll() {
            const trigger = document.getElementById("js-infinite-trigger");
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    setTimeout(() => {
                        generateCardBatch(8);
                    }, 400);
                }
            }, { rootMargin: "200px" });
            
            observer.observe(trigger);
        }
    </script>

<script src="https://pl29631894.effectivecpmnetwork.com/95/de/af/95deaf14afc8ae87770be5dc8aaba73d.js"></script>

</body>
</html>
