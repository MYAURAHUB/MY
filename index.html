<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATINAS</title>
    <meta name="description" content="Premium visual network inspired by the future. Engineered for elite creators.">
    
    <style>
        /* ==========================================================================
        1. DESIGN SYSTEM & VARIABLES (Stripe/Linear Inspired)
           ========================================================================== */
        :root {
            --bg-base: #030303;
            --bg-surface: rgba(18, 18, 18, 0.6);
            --bg-surface-hover: rgba(30, 30, 30, 0.8);
            --border-glow: rgba(255, 255, 255, 0.08);
            --border-glow-hover: rgba(255, 255, 255, 0.2);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #ffffff;
            --accent-gradient: linear-gradient(135deg, #ff3366, #6633ff);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --blur-radius: 20px;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none !important; /* For custom mouse follower */
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* ==========================================================================
        2. CINEMATIC BACKGROUNDS (Aurora & Particles)
           ========================================================================== */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
            opacity: 0.6;
        }

        .aurora-sphere {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(102,51,255,0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(80px);
            animation: floatAurora 20s infinite alternate var(--transition-smooth);
        }

        .aurora-sphere-2 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,51,102,0.1) 0%, rgba(0,0,0,0) 70%);
            filter: blur(100px);
            animation: floatAurora 15s infinite alternate-reverse var(--transition-smooth);
        }

        @keyframes floatAurora {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.2); }
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* ==========================================================================
        3. CUSTOM MOUSE FOLLOWER
           ========================================================================== */
        .mouse-follower {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        .mouse-follower-aura {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.08s ease-out, width 0.3s, height 0.3s;
        }

        /* Hover State Class triggered by JS */
        .pointer-hover .mouse-follower {
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
        }
        .pointer-hover .mouse-follower-aura {
            width: 60px;
            height: 60px;
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* ==========================================================================
        4. ULTRA-PREMIUM HEADER (Glassmorphism & Expandable Search)
           ========================================================================== */
        .glass-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: var(--bg-surface);
            backdrop-filter: blur(var(--blur-radius));
            -webkit-backdrop-filter: blur(var(--blur-radius));
            border-bottom: 1px solid var(--border-glow);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            transition: background 0.3s, border 0.3s;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .nav-menu {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s var(--transition-smooth);
            position: relative;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-primary);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s var(--transition-smooth);
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        /* Advanced Expandable Search Bar */
        .search-container {
            flex: 0 1 400px;
            position: relative;
            transition: flex 0.4s var(--transition-smooth);
        }

        .search-container:focus-within {
            flex: 0 1 550px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 30px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 14px;
            outline: none;
            transition: all 0.3s var(--transition-smooth);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            width: 16px;
            height: 16px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        /* Magnetic Notification Bell Button */
        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            position: relative;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glow);
            transition: background 0.3s;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.08);
        }

        .notification-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 6px;
            height: 6px;
            background: #ff3366;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff3366;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-glow);
            transition: transform 0.3s var(--transition-smooth);
        }

        .user-avatar:hover {
            transform: scale(1.05);
        }

        /* ==========================================================================
        5. MAIN INTERFACE: REVEAL HERO & PERFECT MASONRY GRID
           ========================================================================== */
        main {
            padding-top: 120px;
            padding-bottom: 60px;
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* Masonry Layout */
        .masonry-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
        padding: 0 40px;
        width: 100%;
}

        /* Responsive Columns adjustment */
        @media (max-width: 1200px) {
    .masonry-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 768px) {
    .masonry-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        padding: 0 16px;
    }

    .glass-header {
        padding: 0 16px;
    }

    .search-container {
        display: none;
    }
}

        /* ==========================================================================
        6. ARTIFACT CARDS (3D Tilt, Cinematic Zoom, Dynamic Overlays)
           ========================================================================== */
        .card-wrapper {
    margin: 0;
    width: 100%;
    opacity: 0;
    transform: translateY(40px) scale(0.95);
    animation: revealCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    perspective: 1000px;
}

        @keyframes revealCard {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .premium-card {
            position: relative;
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            overflow: hidden;
            transform-style: preserve-3d;
            height: 100%;
            transition: border-color 0.4s var(--transition-smooth), box-shadow 0.4s var(--transition-smooth);
            
        }

        .premium-card:hover {
            border-color: var(--border-glow-hover);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(255,255,255,0.02);
        }

        .card-media-box {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #111;
    aspect-ratio: 1 / 1.3;
}

        /* Progressive Image Zoom & Scale */
        .card-img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 0.7s cubic-bezier(0.15, 1, 0.3, 1);
    will-change: transform;
}

        .premium-card:hover .card-img {
            transform: scale(1.06) translateZ(10px);
        }

        /* Cinematic Luxury Overlay */
        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(3,3,3,0.95) 0%, rgba(3,3,3,0.4) 40%, rgba(0,0,0,0) 100%);
            opacity: 0;
            transition: opacity 0.4s var(--transition-smooth);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            z-index: 2;
        }

        .premium-card:hover .card-overlay {
            opacity: 1;
        }

        .card-content {
            transform: translateY(15px);
            transition: transform 0.4s var(--transition-smooth);
        }

        .premium-card:hover .card-content {
            transform: translateY(0);
        }

        .card-category {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .premium-card:hover .card-footer {
            opacity: 1;
            transition-delay: 0.1s;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .author-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .author-name {
            font-size: 12px;
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Floating Interactive Action Buttons */
        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #fff;
            color: #000;
            transform: scale(1.05);
        }

        /* ==========================================================================
        7. SKELETON LOADING EFFECTS
           ========================================================================== */
        .skeleton-card {
            height: 350px;
            background: rgba(255,255,255,0.02);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid var(--border-glow);
        }

        .skeleton-card::after {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0) 100%);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .infinite-loader-trigger {
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--text-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }


        @media (hover: none), (pointer: coarse) {

    * {
        cursor: auto !important;
    }

    .mouse-follower,
    .mouse-follower-aura {
        display: none !important;
    }
}
    </style>
</head>
<body>

    <div class="mouse-follower" id="js-follower"></div>
    <div class="mouse-follower-aura" id="js-follower-aura"></div>

    <div class="aurora-bg">
        <div class="aurora-sphere"></div>
        <div class="aurora-sphere-2"></div>
    </div>
    <canvas id="particle-canvas"></canvas>

    <header class="glass-header">
        <div class="header-left">
            <div class="logo">LATINAS</div>
    </header>

    <main>
        <div class="masonry-grid" id="js-grid">
            </div>

        <div class="infinite-loader-trigger" id="js-infinite-trigger">
            <div class="spinner"></div>
        </div>
    </main>

<script>
        // 1. CONFIGURA AQUÍ TUS IMÁGENES LOCALES
        // 'w' y 'h' definen la proporción de la tarjeta (ej. w:400, h:600 es vertical | w:400, h:300 es horizontal)
        const ASSET_PIPELINE = [
            { img: "1.jpg", },
            { img: "2.jpg", },
            { img: "3.JPG", },
            { img: "4.png", },
            { img: "5.jpg", },
            { img: "6.jpg", },
            { img: "7.png", },
            { img: "8.jpg", },
            { img: "9.JPG", },
            { img: "10.png", },
            { img: "11.JPG", },
            { img: "12.JPG", },
            { img: "13.png", },
            { img: "14.jpg", },
            { img: "15.JPG", },
            { img: "16.JPG", },
            { img: "17.JPG", },
            { img: "18.JPG", },
            { img: "19.JPG", },
            { img: "20.JPG", },
            { img: "21.JPG", },
            { img: "22.jpeg", },
            { img: "23.JPG", },
            { img: "24.jpeg",},
            { img: "25.JPG", },
        ];

        document.addEventListener("DOMContentLoaded", () => {

    const isMobile =
        window.matchMedia("(hover: none)").matches ||
        window.matchMedia("(pointer: coarse)").matches;

    if (!isMobile) {
        initMouseFollower();
        initMagneticButtons();
    } else {
        document.getElementById("js-follower")?.remove();
        document.getElementById("js-follower-aura")?.remove();
    }

    initParticleBackground();

    generateCardBatch(ASSET_PIPELINE.length);
    initInfiniteScroll();
});
            
            // Renderizado inicial (Si tienes pocas imágenes, pon un número menor a 12 aquí)


        /* --------------------------------------------------------------------------
        A. INTERACTIVE MOUSE PATTERNS & HOVER EFFECTS
           -------------------------------------------------------------------------- */
        function initMouseFollower() {
            const follower = document.getElementById("js-follower");
            const aura = document.getElementById("js-follower-aura");
            
            let posX = 0, posY = 0;
            let mouseX = 0, mouseY = 0;

            window.addEventListener("mousemove", (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                
                follower.style.left = `${mouseX}px`;
                follower.style.top = `${mouseY}px`;
            });

            function animateAura() {
                posX += (mouseX - posX) * 0.15;
                posY += (mouseY - posY) * 0.15;
                
                aura.style.left = `${posX}px`;
                aura.style.top = `${posY}px`;
                
                requestAnimationFrame(animateAura);
            }
            animateAura();

            const bindHovers = () => {
                const interactives = document.querySelectorAll("a, button, .premium-card, input");
                interactives.forEach(el => {
                    el.addEventListener("mouseenter", () => document.body.classList.add("pointer-hover"));
                    el.addEventListener("mouseleave", () => document.body.classList.remove("pointer-hover"));
                });
            };
            
            const observer = new MutationObserver(bindHovers);
            observer.observe(document.getElementById("js-grid"), { childList: true });
            bindHovers();
        }

        /* --------------------------------------------------------------------------
        B. AMBIENT PARTICLES MATRIX
           -------------------------------------------------------------------------- */
        function initParticleBackground() {
            const canvas = document.getElementById("particle-canvas");
            const ctx = canvas.getContext("2d");
            let particles = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener("resize", resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 1.5 + 0.5;
                    this.speedX = Math.random() * 0.2 - 0.1;
                    this.speedY = Math.random() * -0.3 - 0.1;
                    this.alpha = Math.random() * 0.5 + 0.1;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.y < 0) {
                        this.y = canvas.height;
                        this.x = Math.random() * canvas.width;
                    }
                }
                draw() {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(loop);
            }
            loop();
        }

        /* --------------------------------------------------------------------------
        C. MAGNETIC INTERACTION ENGINE
           -------------------------------------------------------------------------- */
        function initMagneticButtons() {
            const targets = document.querySelectorAll('.magnetic');
            
            targets.forEach(btn => {
                btn.addEventListener('mousemove', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width/2;
                    const y = e.clientY - rect.top - rect.height/2;
                    
                    this.style.transform = `translate(${x * 0.35}px, ${y * 0.35}px)`;
                });
                
                btn.addEventListener('mouseleave', function() {
                    this.style.transform = 'translate(0px, 0px)';
                });
            });
        }

        /* --------------------------------------------------------------------------
        D. CARDS GENERATOR PIPELINE (Optimized for Local Paths)
           -------------------------------------------------------------------------- */
        function generateCardBatch(count) {
            const grid = document.getElementById("js-grid");
            
            for (let i = 0; i < count; i++) {
                // Toma una imagen del arreglo de forma aleatoria para simular scroll infinito
                const schema = ASSET_PIPELINE[Math.floor(Math.random() * ASSET_PIPELINE.length)];
                
                const cardWrapper = document.createElement("div");
                cardWrapper.className = "card-wrapper";
                cardWrapper.style.animationDelay = `${(i % 6) * 0.08}s`;

                cardWrapper.innerHTML = `
                    <div class="premium-card">
                        <div class="card-media-box" style="aspect-ratio:1/1.3">
                            <img src="${schema.img}" alt="${schema.title}" class="card-img" loading="lazy">
                        </div>
                        <div class="card-overlay">
                            <div class="card-content">
                                <div class="card-footer">
                                    <div class="author-info">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                grid.appendChild(cardWrapper);
                bindTiltEffect(cardWrapper.querySelector('.premium-card'));
            }
        }

        function bindTiltEffect(card) {

    if (window.innerWidth <= 768) return;

    card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const xc = rect.width / 2;
        const yc = rect.height / 2;

        const angleX = (yc - y) / 15;
        const angleY = (x - xc) / 15;

        card.style.transform =
            `rotateX(${angleX}deg) rotateY(${angleY}deg) scale3d(1.01,1.01,1.01)`;
    });

    card.addEventListener('mouseleave', () => {
        card.style.transform =
            'rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
    });
}

        /* --------------------------------------------------------------------------
        E. INFINITE SCROLL PIPELINE
           -------------------------------------------------------------------------- */
        function initInfiniteScroll() {
            const trigger = document.getElementById("js-infinite-trigger");
            
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    setTimeout(() => {
                        // Carga 4 imágenes aleatorias más de tu lista al llegar al final
                        generateCardBatch(4);
                    }, 300);
                }
            }, {
                rootMargin: "250px"
            });

            observer.observe(trigger);
        }
    </script>
</body>

</html>
